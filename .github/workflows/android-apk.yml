
name: Build InfoKini Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source project
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak proyek InfoKini
        run: |
          unzip -q InfoKini_News_Studio_Project.zip -d extracted
          cp -R extracted/infokini_news_studio/. .

      - name: Periksa file proyek
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "File proyek InfoKini ditemukan"

      - name: Atur Java dan Kotlin ke versi 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          marker = "    buildFeatures { compose = true }"

          replacement = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }"""

          if marker not in s:
              raise SystemExit("Bagian buildFeatures tidak ditemukan")

          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          print("Konfigurasi Java dan Kotlin berhasil diperbarui")
          PY

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bangun APK
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: InfoKini-News-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
