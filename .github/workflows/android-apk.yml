YAML

name: Build InfoKini Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source project
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak proyek InfoKini
        run: |
          unzip -q InfoKini_News_Studio_Project.zip -d extracted
          cp -R extracted/infokini_news_studio/. .

      - name: Paksa target Java dan Kotlin ke 17
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bangun APK
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: InfoKini-News-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
